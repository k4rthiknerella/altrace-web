<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard, Altrace Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=6">
  <link rel="stylesheet" href="css/console.css?v=1">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
</head>
<body class="console-page">
  <aside id="console-sidebar" class="console-sidebar"></aside>

  <div class="console-main">
    <div class="console-topbar">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <h2 class="topbar-title">Dashboard</h2>
      <button class="topbar-search-hint" onclick="openCommandPalette()" title="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search <kbd>&#8984;K</kbd>
      </button>
      <span class="topbar-status" id="sse-status">Connecting...</span>
    </div>

    <div class="console-content">
      <!-- Row 1: 4 stat panels -->
      <div class="grid-4" style="margin-bottom: var(--sp-4);">
        <div class="panel" id="panel-fleet">
          <div class="panel-header"><span class="panel-title">Fleet</span></div>
          <div class="panel-value" id="fleet-active"><span class="skeleton skeleton-value"></span></div>
          <div class="panel-sub">active of <span id="fleet-total">--</span> sidecars</div>
        </div>

        <div class="panel" id="panel-kill">
          <div class="panel-header"><span class="panel-title">Kill State</span></div>
          <div class="panel-value" id="kill-status"><span class="skeleton skeleton-value"></span></div>
          <div class="panel-sub" id="kill-detail"></div>
        </div>

        <div class="panel" id="panel-policy">
          <div class="panel-header"><span class="panel-title">Policy</span></div>
          <div class="panel-value" id="policy-version"><span class="skeleton skeleton-value"></span></div>
          <div class="panel-sub"><span id="policy-acked">--</span> / <span id="policy-total">--</span> acknowledged</div>
        </div>

        <div class="panel" id="panel-cost">
          <div class="panel-header"><span class="panel-title">Cost (24h)</span></div>
          <div class="panel-value" id="cost-total"><span class="skeleton skeleton-value"></span></div>
        </div>
      </div>

      <!-- Row 2: Budget + Decisions -->
      <div class="grid-2" style="margin-bottom: var(--sp-4);">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Budget Utilization</span></div>
          <div id="budget-chart" class="bar-chart"></div>
          <div id="budget-empty" class="empty-state" style="display:none;">No budget data available.</div>
        </div>

        <div class="panel">
          <div class="panel-header"><span class="panel-title">Decisions (24h)</span></div>
          <div id="decisions-chart"></div>
        </div>
      </div>

      <!-- Row 3: ECharts, Request Volume + Latency -->
      <div class="grid-2" style="margin-bottom: var(--sp-4);">
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Request Volume</span></div>
          <div id="chart-request-volume" class="chart-container"></div>
        </div>

        <div class="panel">
          <div class="panel-header"><span class="panel-title">Latency P50 / P95 / P99</span></div>
          <div id="chart-latency" class="chart-container"></div>
        </div>
      </div>

      <!-- Row 4: Recent Activity -->
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Recent Activity</span></div>
        <div id="activity-feed-container"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/console.js"></script>
  <script>
    initConsole('dashboard');

    // Track ECharts instances for disposal on refresh
    let _chartVolume = null;
    let _chartLatency = null;

    async function loadDashboard() {
      try {
        const resp = await authFetch('/api/v1/dashboard');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        // Fleet
        const f = data.fleet || {};
        document.getElementById('fleet-active').textContent = f.active ?? '--';
        document.getElementById('fleet-total').textContent = f.total_sidecars ?? '--';

        // Kill state
        const k = data.kill_switch || {};
        const teamKills = (k.active_team_kills || []).length;
        const agentKills = (k.active_agent_kills || []).length;
        const killEl = document.getElementById('kill-status');
        const killDetail = document.getElementById('kill-detail');

        if (k.global) {
          killEl.textContent = '';
          const badge = document.createElement('span');
          badge.className = 'badge badge-killed';
          badge.textContent = 'GLOBAL KILL';
          killEl.appendChild(badge);
          killDetail.textContent = 'All traffic halted';
        } else if (teamKills + agentKills > 0) {
          killEl.textContent = '';
          const badge = document.createElement('span');
          badge.className = 'badge badge-warn';
          badge.textContent = 'ACTIVE';
          killEl.appendChild(badge);
          killDetail.textContent = teamKills + ' team, ' + agentKills + ' agent';
        } else {
          killEl.textContent = '';
          const badge = document.createElement('span');
          badge.className = 'badge badge-active';
          badge.textContent = 'CLEAR';
          killEl.appendChild(badge);
          killDetail.textContent = 'No active kill switches';
        }

        // Policy
        const p = data.policy || {};
        document.getElementById('policy-version').textContent = p.current_version ? 'v' + p.current_version : '--';
        const rollout = p.rollout || {};
        document.getElementById('policy-acked').textContent = rollout.acknowledged ?? '--';
        document.getElementById('policy-total').textContent = rollout.total ?? '--';

        // Cost 24h
        const c = data.cost_24h || {};
        document.getElementById('cost-total').textContent = formatUSD(c.total_usd);

        // Budget
        const budgetTeams = (data.budget || {}).teams || [];
        const budgetChart = document.getElementById('budget-chart');
        const budgetEmpty = document.getElementById('budget-empty');

        if (budgetTeams.length === 0) {
          while (budgetChart.firstChild) budgetChart.removeChild(budgetChart.firstChild);
          budgetEmpty.style.display = 'block';
        } else {
          budgetEmpty.style.display = 'none';
          while (budgetChart.firstChild) budgetChart.removeChild(budgetChart.firstChild);
          budgetTeams.forEach(function (t) {
            var pct = t.allocated_usd > 0 ? (t.used_usd / t.allocated_usd * 100) : 0;
            var colorClass = pct > 90 ? 'bar-fill-danger' : pct > 75 ? 'bar-fill-warning' : 'bar-fill-accent';

            var row = document.createElement('div');
            row.className = 'bar-row';

            var label = document.createElement('span');
            label.className = 'bar-label';
            label.textContent = t.team;

            var track = document.createElement('div');
            track.className = 'bar-track';
            var fill = document.createElement('div');
            fill.className = 'bar-fill ' + colorClass;
            fill.style.width = Math.min(pct, 100) + '%';
            track.appendChild(fill);

            var value = document.createElement('span');
            value.className = 'bar-value';
            value.textContent = formatUSD(t.used_usd);

            var pctSpan = document.createElement('span');
            pctSpan.className = 'bar-pct';
            pctSpan.textContent = Math.round(pct) + '%';

            row.appendChild(label);
            row.appendChild(track);
            row.appendChild(value);
            row.appendChild(pctSpan);
            budgetChart.appendChild(row);
          });
        }

        // Decisions 24h
        const d = data.decisions_24h || {};
        const total = (d.allow || 0) + (d.block || 0) + (d.kill || 0) + (d.warn || 0);
        const decisionsEl = document.getElementById('decisions-chart');

        while (decisionsEl.firstChild) decisionsEl.removeChild(decisionsEl.firstChild);

        if (total === 0) {
          var emptyDiv = document.createElement('div');
          emptyDiv.className = 'empty-state';
          emptyDiv.textContent = 'No decisions recorded.';
          decisionsEl.appendChild(emptyDiv);
        } else {
          const items = [
            { label: 'Allow', value: d.allow || 0, color: 'bar-fill-success' },
            { label: 'Block', value: d.block || 0, color: 'bar-fill-danger' },
            { label: 'Kill', value: d.kill || 0, color: 'bar-fill-danger' },
            { label: 'Warn', value: d.warn || 0, color: 'bar-fill-warning' }
          ];
          const maxVal = Math.max.apply(null, items.map(function (i) { return i.value; }));

          var chartDiv = document.createElement('div');
          chartDiv.className = 'bar-chart';

          items.forEach(function (i) {
            var pct = maxVal > 0 ? (i.value / maxVal * 100) : 0;

            var row = document.createElement('div');
            row.className = 'bar-row';

            var label = document.createElement('span');
            label.className = 'bar-label';
            label.textContent = i.label;

            var track = document.createElement('div');
            track.className = 'bar-track';
            var fill = document.createElement('div');
            fill.className = 'bar-fill ' + i.color;
            fill.style.width = pct + '%';
            track.appendChild(fill);

            var value = document.createElement('span');
            value.className = 'bar-value';
            value.style.color = 'var(--text-secondary)';
            value.textContent = i.value.toLocaleString();

            row.appendChild(label);
            row.appendChild(track);
            row.appendChild(value);
            chartDiv.appendChild(row);
          });

          decisionsEl.appendChild(chartDiv);
        }

        // ── ECharts: Request Volume + Latency ──────────────────
        renderDashboardCharts();

        // ── Activity Feed ──────────────────────────────────────
        renderActivityFeed();

      } catch (err) {
        if (err.message !== 'Session expired') {
          showToast('Failed to load dashboard: ' + err.message, 'error');
        }
      }
    }

    // ── Chart rendering ───────────────────────────────────────

    function getDashboardChartColors() {
      const isDark = document.body.classList.contains('dark');
      return {
        primary: '#0d9488',
        secondary: '#3b82f6',
        tertiary: '#8b5cf6',
        gridLine: isDark ? '#2a2a35' : '#e5e5e0',
        axisLabel: isDark ? '#a0a0b0' : '#525252',
        tooltipBg: isDark ? '#1a1a22' : '#ffffff',
        tooltipBorder: isDark ? '#2a2a35' : '#e5e5e0',
        tooltipText: isDark ? '#e8e8e8' : '#1a1a1a',
        bg: 'transparent'
      };
    }

    function generateMockTimeseries() {
      const now = new Date();
      const hours = [];
      const volume = [];
      const p50 = [];
      const p95 = [];
      const p99 = [];

      for (let i = 23; i >= 0; i--) {
        const t = new Date(now.getTime() - i * 3600000);
        hours.push(t.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }));

        // Request volume: 200-800 range with a midday peak
        const hourOfDay = t.getHours();
        const baseLine = 300 + 250 * Math.sin((hourOfDay - 6) * Math.PI / 12);
        volume.push(Math.max(50, Math.round(baseLine + (Math.random() - 0.5) * 120)));

        // Latency: P50 ~120ms, P95 ~350ms, P99 ~600ms with some variance
        const latBase = 100 + 30 * Math.sin((hourOfDay - 4) * Math.PI / 14);
        p50.push(Math.round(latBase + (Math.random() - 0.5) * 40));
        p95.push(Math.round(latBase * 2.8 + (Math.random() - 0.5) * 80));
        p99.push(Math.round(latBase * 5.0 + (Math.random() - 0.5) * 150));
      }

      return { hours: hours, volume: volume, p50: p50, p95: p95, p99: p99 };
    }

    function renderDashboardCharts() {
      const colors = getDashboardChartColors();
      const mock = generateMockTimeseries();
      const fontFamily = "'IBM Plex Mono', 'JetBrains Mono', monospace";

      // Dispose previous instances
      if (_chartVolume) { _chartVolume.dispose(); _chartVolume = null; }
      if (_chartLatency) { _chartLatency.dispose(); _chartLatency = null; }

      const volEl = document.getElementById('chart-request-volume');
      const latEl = document.getElementById('chart-latency');
      if (!volEl || !latEl) return;

      // ── Request Volume chart ──
      _chartVolume = echarts.init(volEl);
      _chartVolume.setOption({
        backgroundColor: colors.bg,
        tooltip: {
          trigger: 'axis',
          backgroundColor: colors.tooltipBg,
          borderColor: colors.tooltipBorder,
          textStyle: { color: colors.tooltipText, fontFamily: fontFamily, fontSize: 12 }
        },
        legend: {
          top: 0,
          textStyle: { color: colors.axisLabel, fontFamily: fontFamily, fontSize: 11 }
        },
        grid: { left: 48, right: 16, top: 32, bottom: 28 },
        xAxis: {
          type: 'category',
          data: mock.hours,
          axisLine: { lineStyle: { color: colors.gridLine } },
          axisLabel: { color: colors.axisLabel, fontFamily: fontFamily, fontSize: 10 },
          axisTick: { show: false }
        },
        yAxis: {
          type: 'value',
          splitLine: { lineStyle: { color: colors.gridLine } },
          axisLabel: { color: colors.axisLabel, fontFamily: fontFamily, fontSize: 10 },
          axisLine: { show: false },
          axisTick: { show: false }
        },
        series: [{
          name: 'Requests',
          type: 'line',
          smooth: true,
          data: mock.volume,
          itemStyle: { color: colors.primary },
          lineStyle: { width: 2, color: colors.primary },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: colors.primary + '30' },
              { offset: 1, color: colors.primary + '05' }
            ])
          },
          symbol: 'none'
        }]
      });

      // ── Latency chart ──
      _chartLatency = echarts.init(latEl);
      _chartLatency.setOption({
        backgroundColor: colors.bg,
        tooltip: {
          trigger: 'axis',
          backgroundColor: colors.tooltipBg,
          borderColor: colors.tooltipBorder,
          textStyle: { color: colors.tooltipText, fontFamily: fontFamily, fontSize: 12 },
          valueFormatter: function (v) { return v + ' ms'; }
        },
        legend: {
          top: 0,
          textStyle: { color: colors.axisLabel, fontFamily: fontFamily, fontSize: 11 }
        },
        grid: { left: 48, right: 16, top: 32, bottom: 28 },
        xAxis: {
          type: 'category',
          data: mock.hours,
          axisLine: { lineStyle: { color: colors.gridLine } },
          axisLabel: { color: colors.axisLabel, fontFamily: fontFamily, fontSize: 10 },
          axisTick: { show: false }
        },
        yAxis: {
          type: 'value',
          splitLine: { lineStyle: { color: colors.gridLine } },
          axisLabel: {
            color: colors.axisLabel,
            fontFamily: fontFamily,
            fontSize: 10,
            formatter: '{value} ms'
          },
          axisLine: { show: false },
          axisTick: { show: false }
        },
        series: [
          {
            name: 'P50',
            type: 'line',
            smooth: true,
            data: mock.p50,
            itemStyle: { color: colors.primary },
            lineStyle: { width: 2, color: colors.primary },
            symbol: 'none'
          },
          {
            name: 'P95',
            type: 'line',
            smooth: true,
            data: mock.p95,
            itemStyle: { color: colors.secondary },
            lineStyle: { width: 2, color: colors.secondary },
            symbol: 'none'
          },
          {
            name: 'P99',
            type: 'line',
            smooth: true,
            data: mock.p99,
            itemStyle: { color: colors.tertiary },
            lineStyle: { width: 2, color: colors.tertiary, type: 'dashed' },
            symbol: 'none'
          }
        ]
      });
    }

    // ── Activity Feed ─────────────────────────────────────────

    function renderActivityFeed() {
      const activities = [
        { type: 'allow', text: 'claude-coder completed 47 requests (ml-research)', time: '2m ago' },
        { type: 'block', text: 'gpt-assistant blocked: budget_exceeded (product-ai)', time: '5m ago' },
        { type: 'policy', text: 'Policy v3 acknowledged by 12/14 sidecars', time: '12m ago' },
        { type: 'approval', text: 'Approval granted: execute_sql (ml-research)', time: '18m ago' },
        { type: 'warn', text: 'Budget warning: product-ai at 87% utilization', time: '25m ago' },
        { type: 'allow', text: 'support-bot completed 12 requests (customer-support)', time: '30m ago' },
        { type: 'kill', text: 'Kill switch deactivated: team/staging (ops-admin)', time: '1h ago' },
        { type: 'block', text: 'infra-agent blocked: content_policy_violation', time: '1h ago' },
      ];

      const container = document.getElementById('activity-feed-container');
      if (!container) return;

      while (container.firstChild) container.removeChild(container.firstChild);

      const ul = document.createElement('ul');
      ul.className = 'activity-feed';

      activities.forEach(function (a) {
        const li = document.createElement('li');
        li.className = 'activity-item';

        const dot = document.createElement('span');
        dot.className = 'activity-dot ' + a.type;

        const text = document.createElement('span');
        text.className = 'activity-text';
        text.textContent = a.text;

        const time = document.createElement('span');
        time.className = 'activity-time';
        time.textContent = a.time;

        li.appendChild(dot);
        li.appendChild(text);
        li.appendChild(time);
        ul.appendChild(li);
      });

      container.appendChild(ul);
    }

    // ── Window resize handler for chart responsiveness ────────

    window.addEventListener('resize', function () {
      if (_chartVolume) _chartVolume.resize();
      if (_chartLatency) _chartLatency.resize();
    });

    loadDashboard();
    startAutoRefresh(loadDashboard, 30000);
    connectSSE();

    onSSE('kill_switch', loadDashboard);
    onSSE('policy_update', loadDashboard);
  </script>
</body>
</html>
