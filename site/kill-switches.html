<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Kill Switches, Altrace Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=6">
  <link rel="stylesheet" href="css/console.css?v=1">
</head>
<body class="console-page">
  <aside id="console-sidebar" class="console-sidebar"></aside>

  <div class="console-main">
    <div class="console-topbar">
      <button class="mobile-menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <h2 class="topbar-title">Kill Switches</h2>
      <span class="topbar-status" id="sse-status">Connecting...</span>
    </div>

    <div class="console-content">
      <!-- Global kill switch -->
      <div class="panel kill-global-card" id="global-kill-card" style="margin-bottom: var(--sp-4);">
        <div class="panel-title" style="margin-bottom: var(--sp-2);">Global Kill Switch</div>
        <div class="kill-global-status" id="global-kill-status"><span class="skeleton skeleton-value"></span></div>
        <div class="kill-global-desc">Activating the global kill switch halts ALL LLM traffic across the entire fleet immediately.</div>
        <button class="btn-danger role-write-only" id="global-kill-btn" onclick="toggleGlobalKill()" style="padding: 10px 28px; font-size: 0.9375rem;">
          Activate Global Kill
        </button>
      </div>

      <!-- New kill switch button -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-3);">
        <h3 style="font-family: var(--font-body); font-size: 1rem; font-weight: 600;">Active Kill Switches</h3>
        <button class="btn btn-secondary btn-nav role-write-only" id="new-kill-btn" onclick="showNewKillForm()">New Kill Switch</button>
      </div>

      <!-- New kill switch form (hidden by default) -->
      <div class="inline-form" id="new-kill-form" style="display: none;">
        <div class="form-group">
          <label for="kill-scope">Scope</label>
          <select id="kill-scope">
            <option value="team">Team</option>
            <option value="agent">Agent</option>
          </select>
        </div>
        <div class="form-group">
          <label for="kill-target">Target</label>
          <input type="text" id="kill-target" placeholder="e.g. apex-rtl-agents">
        </div>
        <div class="form-group">
          <label for="kill-reason">Reason</label>
          <textarea id="kill-reason" rows="2" placeholder="Why is this kill switch being activated?"></textarea>
        </div>
        <div class="inline-form-actions">
          <button class="btn-danger" onclick="submitNewKill()">Activate</button>
          <button class="btn-cancel" onclick="hideNewKillForm()">Cancel</button>
        </div>
      </div>

      <!-- Kill switch entries table -->
      <div class="panel" style="padding: 0; overflow: hidden;">
        <table class="data-table" id="kill-table">
          <thead>
            <tr>
              <th>Scope</th>
              <th>Target</th>
              <th>Status</th>
              <th>Reason</th>
              <th>Activated By</th>
              <th>When</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="kill-entries">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/console.js"></script>
  <script>
    initConsole('kill-switches');

    let killState = null;

    async function loadKillState() {
      try {
        const resp = await authFetch('/api/v1/kill');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        killState = await resp.json();
        renderKillState();
      } catch (err) {
        if (err.message !== 'Session expired') {
          showToast('Failed to load kill switches: ' + err.message, 'error');
        }
      }
    }

    function renderKillState() {
      if (!killState) return;
      const state = killState.state || {};
      const entries = killState.entries || [];
      const card = document.getElementById('global-kill-card');
      const statusEl = document.getElementById('global-kill-status');
      const btn = document.getElementById('global-kill-btn');

      // Global status
      if (state.global) {
        card.classList.add('active');
        statusEl.innerHTML = '<span class="badge badge-killed" style="font-size: 1rem; padding: 4px 12px;">ACTIVE</span>';
        btn.textContent = 'Deactivate Global Kill';
        btn.className = 'btn-cancel role-write-only';
        btn.style.cssText = 'padding: 10px 28px; font-size: 0.9375rem;';
      } else {
        card.classList.remove('active');
        statusEl.innerHTML = '<span class="badge badge-active" style="font-size: 1rem; padding: 4px 12px;">INACTIVE</span>';
        btn.textContent = 'Activate Global Kill';
        btn.className = 'btn-danger role-write-only';
        btn.style.cssText = 'padding: 10px 28px; font-size: 0.9375rem;';
      }

      // Entries table
      const tbody = document.getElementById('kill-entries');
      const active = entries.filter(e => e.active);

      if (active.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No active kill switches.</td></tr>';
        return;
      }

      tbody.innerHTML = active.map(e => `
        <tr>
          <td><span class="badge badge-inactive">${escapeHtml(e.scope)}</span></td>
          <td class="mono">${escapeHtml(e.target)}</td>
          <td><span class="badge badge-killed">ACTIVE</span></td>
          <td>${escapeHtml(e.reason || '--')}</td>
          <td class="mono">${escapeHtml(e.activated_by || '--')}</td>
          <td>${relativeTime(e.activated_at)}</td>
          <td>
            <button class="btn-cancel role-write-only" style="padding: 4px 12px; font-size: 0.75rem;"
              onclick="deactivateKill('${escapeJSAttr(e.scope)}', '${escapeJSAttr(e.target)}')">
              Deactivate
            </button>
          </td>
        </tr>
      `).join('');
    }

    function toggleGlobalKill() {
      const isActive = killState && killState.state && killState.state.global;
      if (isActive) {
        showConfirmDialog(
          'Deactivate Global Kill Switch',
          'All LLM traffic will resume across the fleet. Are you sure?',
          'Deactivate',
          () => doKillAction('DELETE', 'global', 'all')
        );
      } else {
        showConfirmDialog(
          'Activate Global Kill Switch',
          'This will halt ALL LLM traffic across the ENTIRE fleet immediately. This is a critical action.',
          'Activate Global Kill',
          () => doKillAction('POST', 'global', 'all', 'Manual activation from console')
        );
      }
    }

    function deactivateKill(scope, target) {
      showConfirmDialog(
        'Deactivate Kill Switch',
        'Deactivate kill switch for ' + scope + '/' + target + '? Traffic will resume.',
        'Deactivate',
        () => doKillAction('DELETE', scope, target)
      );
    }

    async function doKillAction(method, scope, target, reason) {
      const buttons = document.querySelectorAll('.btn-danger, .btn-cancel');
      buttons.forEach(b => b.disabled = true);
      try {
        const opts = { method };
        if (method === 'POST') {
          opts.body = JSON.stringify({
            reason: reason || 'Manual activation from console',
            actor: (getSession() || {}).org || 'console'
          });
        }
        const resp = await authFetch('/api/v1/kill/' + scope + '/' + target, opts);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        showToast('Kill switch ' + (method === 'POST' ? 'activated' : 'deactivated'), method === 'POST' ? 'error' : 'success');
        loadKillState();
      } catch (err) {
        showToast('Failed: ' + err.message, 'error');
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    }

    function showNewKillForm() {
      document.getElementById('new-kill-form').style.display = 'block';
      document.getElementById('new-kill-btn').style.display = 'none';
    }

    function hideNewKillForm() {
      document.getElementById('new-kill-form').style.display = 'none';
      document.getElementById('new-kill-btn').style.display = '';
    }

    function submitNewKill() {
      const scope = document.getElementById('kill-scope').value;
      const target = document.getElementById('kill-target').value.trim();
      const reason = document.getElementById('kill-reason').value.trim();

      if (!target) { showToast('Target is required', 'error'); return; }

      showConfirmDialog(
        'Activate Kill Switch',
        'Activate ' + scope + ' kill switch for "' + target + '"?',
        'Activate',
        async () => {
          await doKillAction('POST', scope, target, reason || 'Activated from console');
          hideNewKillForm();
          document.getElementById('kill-target').value = '';
          document.getElementById('kill-reason').value = '';
        }
      );
    }

    loadKillState();
    startAutoRefresh(loadKillState, 10000);
    connectSSE();
    onSSE('kill_switch', loadKillState);
  </script>
</body>
</html>
