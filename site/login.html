  <!-- LOGIN FORM -->
  <section class="form-section">
    <div class="container">
      <div class="form-card card" style="max-width: 440px;">
        <h1 class="fade-in">Altrace Console</h1>
        <p class="form-subtitle fade-in fade-in-delay-1">Connect to your Altrace hub to manage fleet governance.</p>

        <form id="login-form" class="fade-in fade-in-delay-2">
          <div class="form-group">
            <label for="org">Organization</label>
            <input type="text" id="org" name="org" placeholder="Acme Corp" required>
          </div>

          <div class="form-group">
            <label for="apiKey">API Key</label>
            <input type="password" id="apiKey" name="apiKey" placeholder="Hub RBAC token" required>
          </div>

          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role">
              <option value="admin">Admin</option>
              <option value="operator" selected>Operator</option>
              <option value="viewer">Viewer</option>
            </select>
          </div>

          <div id="login-error" style="display:none; padding: 12px; margin-bottom: 16px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 6px; color: var(--danger); font-size: 0.875rem;"></div>

          <button type="submit" class="btn btn-primary btn-large btn-full">Sign In</button>
        </form>

        <p class="form-footer" style="margin-top: var(--sp-4);">
          Don't have an API key? Generate one from your hub config<br>
          or <a href="request-access.html" style="color: var(--accent);">request access</a>.
        </p>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already authenticated
    if (getSession()) {
      window.location.href = '/dashboard';
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const org = document.getElementById('org').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const role = document.getElementById('role').value;
      const errorEl = document.getElementById('login-error');
      const btn = this.querySelector('button[type="submit"]');

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Connecting...';

      try {
        const resp = await fetch('/api/v1/dashboard', {
          headers: { 'Authorization': 'Bearer ' + apiKey }
        });

        if (resp.status === 401 || resp.status === 403) {
          errorEl.textContent = 'Invalid API key. Check your hub RBAC token.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        if (!resp.ok) {
          errorEl.textContent = 'Hub returned HTTP ' + resp.status + '. Check that the hub is running.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        setSession(org, apiKey, role);
        window.location.href = '/dashboard';
      } catch (err) {
        errorEl.textContent = 'Cannot reach hub. Verify the hub is running and nginx is proxying /api/*.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
  <script src="js/main.js"></script>
