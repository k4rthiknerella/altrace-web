server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── NEW-15: CORS policy — NO localhost origins ────────────────────────────
    # No Access-Control-Allow-Origin headers are set here. The console is a
    # same-origin application served from a single domain. No cross-origin
    # access is permitted. No localhost or 127.0.0.1 origins are whitelisted
    # anywhere in this configuration or in vercel.json.
    # ─────────────────────────────────────────────────────────────────────────

    # ── NEW-02: CSP — nonce migration plan ────────────────────────────────────
    # CURRENT STATE: 'unsafe-inline' is present in script-src and style-src.
    # This is required because the site has ~17 inline <script> blocks across
    # authenticated console pages (dashboard, login, kill-switches, etc.) and
    # widespread use of inline style attributes for theming.
    #
    # MIGRATION PLAN (nonce-based CSP):
    # Step 1: Move all inline <script> blocks to external .js files in site/js/.
    #         Each authenticated page has 1-3 inline script blocks that initialize
    #         page-specific data. These must be extracted and parameterized.
    # Step 2: Add nonce generation to the nginx config (Lua module or per-request
    #         header injection). Alternatively, use Vercel Edge Middleware to inject
    #         a cryptographically random nonce per response.
    # Step 3: Thread the nonce through HTML: <script nonce="${NONCE}"> and
    #         update CSP to: script-src 'self' 'nonce-${NONCE}' cdn.jsdelivr.net
    # Step 4: For inline styles: either extract to CSS classes or use nonce on
    #         <style> tags. Remove 'unsafe-inline' from style-src last.
    # Step 5: Remove 'unsafe-inline' from both directives.
    # BLOCKER: Static file serving (Vercel + nginx) does not natively support
    #          per-request nonce injection without Edge Middleware or Lua.
    #          This migration requires a server-side rendering step or Vercel
    #          Edge Middleware (Next.js / Edge Functions).
    #
    # NEW-03: SRI status for CDN scripts:
    #   - echarts@5.6.0: integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" (VERIFIED 2026-03-29)
    #   - supabase-js@2.99.2: integrity="sha384-zETTH+6IXxKQ6zbGcT6H6EDdnGaae9uhI8uO7doTJoNEmPGeTKVOe5S6/XybS9JH" (VERIFIED 2026-03-29)
    #   - Google Fonts CSS: SRI NOT POSSIBLE. Google Fonts serves dynamic CSS
    #     per user-agent to optimize font format (woff2/woff/ttf). The response
    #     body differs per browser, so no stable hash can be computed. Mitigation:
    #     fonts are stylesheet-only (no script execution) and served from
    #     fonts.googleapis.com which is already in the CSP allowlist.
    # ─────────────────────────────────────────────────────────────────────────

    # security response headers (WEB-04)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # NOTE: 'unsafe-inline' in script-src/style-src — see nonce migration plan above.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; connect-src 'self' *.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # health check endpoint
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # cache static assets
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # NOTE: 'unsafe-inline' — see nonce migration plan in server block above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; connect-src 'self' *.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # HTML pages — no cache
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # NOTE: 'unsafe-inline' — see nonce migration plan in server block above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; connect-src 'self' *.supabase.co; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # API reverse proxy to hub
    location /api/ {
        proxy_pass https://${HUB_HOST}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;

        # SSE support — disable buffering so events stream immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # clean URLs and SPA fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # custom 404
    error_page 404 /404.html;
}
